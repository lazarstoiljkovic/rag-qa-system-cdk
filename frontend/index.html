<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Q&A System - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .solution-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .solution-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            color: #667eea;
            font-weight: 600;
        }

        .solution-btn.active {
            background: #764ba2;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input[type="text"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px;
            background: #f5f5f5;
            border: 2px dashed #ccc;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #e8e8e8;
            border-color: #667eea;
        }

        .file-name {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .response {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .response.show {
            display: block;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .response h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .response pre {
            background: white;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 0.9em;
        }

        .answer-text {
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
        }

        .sources {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }

        .source-item {
            background: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-box strong {
            color: #856404;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .solution-selector {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 RAG Q&A System</h1>
            <p>Document-based Question Answering with AWS Bedrock</p>
        </div>

        <div class="solution-selector">
            <button class="solution-btn active" data-solution="knowledge-base">
                Knowledge Base Solution
            </button>
            <button class="solution-btn" data-solution="opensearch">
                Custom OpenSearch Solution
            </button>
        </div>

        <div class="main-content">
            <!-- Document Upload Section -->
            <div class="card">
                <h2>📄 Upload Document</h2>
                
                <div class="form-group">
                    <label for="documentFile">Select Document (PDF, DOCX, TXT)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="documentFile" accept=".pdf,.docx,.txt">
                        <label for="documentFile" class="file-input-label">
                            📁 Choose File
                        </label>
                    </div>
                    <div class="file-name" id="fileName"></div>
                </div>

                <div class="form-group">
                    <label for="documentLanguage">Language</label>
                    <select id="documentLanguage">
                        <option value="sr">🇷🇸 Serbian (Srpski)</option>
                        <option value="en">🇬🇧 English</option>
                    </select>
                </div>

                <button class="btn" id="uploadBtn">Upload Document</button>

                <div class="loading" id="uploadLoading">
                    <div class="spinner"></div>
                    <p>Uploading...</p>
                </div>

                <div class="response" id="uploadResponse"></div>
            </div>

            <!-- Q&A Section -->
            <div class="card">
                <h2>❓ Ask Question</h2>
                
                <div class="form-group">
                    <label for="question">Your Question</label>
                    <textarea 
                        id="question" 
                        placeholder="Enter your question in Serbian or English..."></textarea>
                </div>

                <div class="form-group">
                    <label for="queryLanguage">Question Language</label>
                    <select id="queryLanguage">
                        <option value="sr">🇷🇸 Serbian (Srpski)</option>
                        <option value="en">🇬🇧 English</option>
                    </select>
                </div>

                <button class="btn" id="queryBtn">Get Answer</button>

                <div class="loading" id="queryLoading">
                    <div class="spinner"></div>
                    <p>Generating answer...</p>
                </div>

                <div class="response" id="queryResponse"></div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            'knowledge-base': {
                apiEndpoint: 'https://v3pr599alj.execute-api.us-east-1.amazonaws.com/prod'
            },
            'opensearch': {
                apiEndpoint: 'https://9np90rddb0.execute-api.us-east-1.amazonaws.com/prod'
            }
        };

        let currentSolution = 'knowledge-base';

        // Solution selector
        document.querySelectorAll('.solution-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.solution-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentSolution = this.dataset.solution;
            });
        });

        // File input handler
        document.getElementById('documentFile').addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name || '';
            document.getElementById('fileName').textContent = fileName ? `Selected: ${fileName}` : '';
        });

        // Upload document
        document.getElementById('uploadBtn').addEventListener('click', async function() {
            const fileInput = document.getElementById('documentFile');
            const language = document.getElementById('documentLanguage').value;
            
            if (!fileInput.files[0]) {
                alert('Please select a file');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                const base64Content = e.target.result.split(',')[1];
                
                document.getElementById('uploadLoading').classList.add('show');
                document.getElementById('uploadBtn').disabled = true;

                try {
                    const response = await fetch(`${CONFIG[currentSolution].apiEndpoint}/documents`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            file: base64Content,
                            filename: file.name,
                            language: language
                        })
                    });

                    const data = await response.json();
                    
                    const responseDiv = document.getElementById('uploadResponse');
                    responseDiv.innerHTML = `
                        <h3>✅ Upload Successful</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    responseDiv.classList.add('show');

                } catch (error) {
                    alert('Error uploading document: ' + error.message);
                } finally {
                    document.getElementById('uploadLoading').classList.remove('show');
                    document.getElementById('uploadBtn').disabled = false;
                }
            };

            reader.readAsDataURL(file);
        });

        // Query Q&A
        document.getElementById('queryBtn').addEventListener('click', async function() {
            const question = document.getElementById('question').value.trim();
            const language = document.getElementById('queryLanguage').value;
            
            if (!question) {
                alert('Please enter a question');
                return;
            }

            document.getElementById('queryLoading').classList.add('show');
            document.getElementById('queryBtn').disabled = true;

            try {
                const response = await fetch(`${CONFIG[currentSolution].apiEndpoint}/qa`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        question: question,
                        language: language
                    })
                });

                const data = await response.json();
                
                const responseDiv = document.getElementById('queryResponse');
                
                let sourcesHtml = '';
                if (data.sources && data.sources.length > 0) {
                    sourcesHtml = `
                        <div class="sources">
                            <strong>📚 Sources:</strong>
                            ${data.sources.map(source => `
                                <div class="source-item">
                                    ${source.filename || source} 
                                    ${source.score ? `(Relevance: ${(source.score * 100).toFixed(1)}%)` : ''}
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                responseDiv.innerHTML = `
                    <h3>💡 Answer</h3>
                    <div class="answer-text">${data.answer}</div>
                    ${sourcesHtml}
                    <p style="margin-top: 10px; color: #666; font-size: 0.9em;">
                        Processing time: ${data.processingTime}s
                    </p>
                `;
                responseDiv.classList.add('show');

            } catch (error) {
                alert('Error getting answer: ' + error.message);
            } finally {
                document.getElementById('queryLoading').classList.remove('show');
                document.getElementById('queryBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
